[package]
name = "brain-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "brain_core"

# ENG-5/ENG-6: brain-core has ZERO *AI/ML* runtime dependencies, by design,
# not by oversight -- every numeric primitive (PRNG, arena, scheduler) is
# written in this crate. `rayon` below is the one anticipated exception
# (README ENG-6: "the Rust core should need approximately rayon and nothing
# else"), used only for RUN-4's partitioned parallelism (`partition.rs`).
# Verify with `cargo tree -p brain-core` -- it must show no edge to a
# forbidden dependency category (`tests/workspace_policy.rs` names the
# specific disallowed terms), not that this section is empty.

[dependencies]
rayon = "1.12.0"

[dev-dependencies]
# Dev-only tooling is exempt from the zero-dependency rule (ENG-6, Req 1.4).
proptest = "1.11.0"
criterion = "0.8.2"

[[bench]]
name = "core_bench"
harness = false
